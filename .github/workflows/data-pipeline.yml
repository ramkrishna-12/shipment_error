name: ShopSphere Data Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 2 * * *"

jobs:
  run-data-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Version
        run: python --version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Order Cleaning
        run: |
          python order.py

      - name: Run Merge Pipeline
        run: |
          python merge.py

      - name: Run Final Pipeline
        run: |
          python pipeline.py

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analytics-output
          path: |
            *.csv
            output/

      - name: Pipeline Success
        if: success()
        run: echo "Pipeline completed successfully"

      - name: Pipeline Failure
        if: failure()
        run: echo "Pipeline failed. Probably because humans touched the data again."